name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions_typescript:
    name: Cloud Functions (TypeScript compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: npm ci & build
        working-directory: functions
        run: npm ci && npm run build

  analyze_and_test:
    name: Analyze, test & web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release --no-wasm-dry-run

  integration_smoke_macos:
    name: Integration smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache macOS CocoaPods
        uses: actions/cache@v4
        with:
          path: macos/Pods
          key: macos-pods-${{ hashFiles('macos/Podfile', 'pubspec.lock', 'ios/Podfile.lock') }}
          restore-keys: |
            macos-pods-

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Integration smoke (-d macos)
        run: flutter test integration_test/smoke_test.dart -d macos
