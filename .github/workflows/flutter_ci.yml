name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions_typescript:
    name: Cloud Functions (TypeScript compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: npm ci & build
        working-directory: functions
        run: npm ci && npm run build

  analyze_and_test:
    name: Analyze, test & web build
    runs-on: ubuntu-latest
    # Format + analyze + tests + dart2js can approach the default runner limit; -O2
    # on the web build lowers peak RSS vs default release optimizations.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release --no-wasm-dry-run -O2

  # macOS desktop (`-d macos`) lance l’app via `open` : sur les runners GitHub ça échoue
  # souvent (« Failed to foreground app; open returned 1 », flutter/flutter#176850).
  # L’iOS Simulator reste le mode supporté en CI pour ce smoke.
  integration_smoke_ios_simulator:
    name: Integration smoke (iOS Simulator)
    runs-on: macos-latest
    # Premier run / cache Pods vide : boot simulateur + pod + 1er build iOS peut
    # dépasser 30–40 min sur les runners GitHub ; 60 min évite un timeout « faux négatif ».
    timeout-minutes: 60
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache iOS CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ios-pods-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            ios-pods-

      # Réduit les 429 « Too Many Requests » sur le CDN trunk (raw GitHub) au pod install.
      - name: Cache CocoaPods trunk (CDN specs)
        uses: actions/cache@v5
        with:
          path: ~/.cocoapods/repos/trunk
          key: cocoapods-trunk-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-trunk-${{ runner.os }}-

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Remplit `ios/Pods` pendant que le cache Actions est chaud ; `flutter test` refait
      # un pod léger ensuite au lieu d’un cold start de 15–25 min seul dans la foulée.
      - name: CocoaPods install (iOS)
        run: |
          set -euo pipefail
          cd ios
          for attempt in 1 2 3 4 5; do
            if pod install; then
              exit 0
            fi
            echo "::warning::pod install failed (attempt ${attempt}/5). Retrying after backoff..."
            if [[ "${attempt}" -eq 5 ]]; then
              exit 1
            fi
            sleep $((attempt * 25))
          done

      - name: Boot Simulator & integration smoke
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | grep -m1 -i 'iphone' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)"
          if [[ -z "${UDID}" ]]; then
            echo 'No iPhone simulator UDID found.'
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID=${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          open -a Simulator || true
          flutter devices
          flutter test integration_test/smoke_test.dart -d "${UDID}"
